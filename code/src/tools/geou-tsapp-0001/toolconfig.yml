tool_package_snumber: "geou-tsapp-0001"
tools_sync_cfgs: {
    "manageServer": {
        "0.0.0": {
            "tool_uniq_id": "2054128033208590337",
            "tool_desc": "边缘服务器无人机管控：管理类脑盒子（BrainBox）集群，接收无人机状态上报，转发导航指令，实现云—边—端协同调度。",
            "tool_cfg": [
                {
                    "FunDesc": "通过 WebSocket 长连接管理类脑盒子集群、接收无人机数据上报、转发导航与控制指令到类脑盒子。",
                    "ReqParam": {
                        "dtype": "uvaTrack",
                        "version": "0.0.0",
                        "subfuncs": [
                            {
                                "func_name": "update_brain_box_meta",
                                "func_desc": "更新类脑盒子元数据（盒子通过WS自动发现，此接口仅更新元信息）",
                                "params": {
                                    "box_id": "类脑盒子唯一标识符，如 'brain_box_001'",
                                    "metadata": "自定义元数据，如 {'location': '机房A'}"
                                }
                            },
                            {
                                "func_name": "blacklist_brain_box",
                                "func_desc": "拉黑类脑盒子，阻止其重新连接",
                                "params": {
                                    "box_id": "需要拉黑的类脑盒子唯一标识符"
                                }
                            },
                            {
                                "func_name": "list_brain_boxes",
                                "func_desc": "获取类脑盒子列表及状态",
                                "params": {}
                            },
                            {
                                "func_name": "get_brain_box_status",
                                "func_desc": "查询类脑盒子详细状态（远程调用 brain_box 系统状态接口）",
                                "params": {
                                    "box_id": "类脑盒子唯一标识符"
                                }
                            },
                            {
                                "func_name": "heartbeat",
                                "func_desc": "接收类脑盒子心跳上报，维持在线状态（支持自动发现）",
                                "params": {
                                    "box_id": "类脑盒子唯一标识符",
                                    "timestamp": "上报时间戳（Unix 秒）",
                                    "status": "类脑盒子运行状态，如 'running'",
                                    "drone_count": "管辖的无人机总数",
                                    "online_count": "在线无人机数",
                                    "online_devices": "可选，在线设备简要信息列表，每项含 device_id/status/flight_mode/arm_state",
                                    "ip_address": "可选，类脑盒子 IP（用于自动注册）",
                                    "port": "可选，类脑盒子端口（用于自动注册）"
                                }
                            },
                            {
                                "func_name": "drone_report",
                                "func_desc": "接收无人机状态上报（由类脑盒子转发），包含完整传感器 metadata",
                                "params": {
                                    "box_id": "上报方类脑盒子标识符",
                                    "timestamp": "上报时间戳（Unix 秒）",
                                    "devices": "无人机设备信息列表，每项含 device_id/device_type/protocol/status/position/metadata（metadata 含 attitude/velocity/battery/imu/barometer/gps/flight_mode/arm_state 等传感器数据）"
                                }
                            },
                            {
                                "func_name": "trajectory_report",
                                "func_desc": "接收导航轨迹上报（由类脑盒子转发）",
                                "params": {
                                    "box_id": "上报方类脑盒子标识符",
                                    "timestamp": "上报时间戳（Unix 秒）",
                                    "trajectory": "轨迹数据字典，包含 trajectory_id, device_id, waypoints, algorithm_name, total_distance, estimated_time 等"
                                }
                            },
                            {
                                "func_name": "connect_drone",
                                "func_desc": "转发 TCP 连接无人机指令到指定类脑盒子，由类脑盒子主动发起 TCP 连接",
                                "params": {
                                    "box_id": "目标类脑盒子标识符",
                                    "ip": "无人机 IP 地址，如 '192.168.43.1'",
                                    "port": "无人机 MAVLink TCP 端口，默认 5760",
                                    "label": "可选，连接标签，用于标识该通道"
                                }
                            },
                            {
                                "func_name": "disconnect_drone",
                                "func_desc": "转发断开无人机 TCP 连接指令到指定类脑盒子",
                                "params": {
                                    "box_id": "目标类脑盒子标识符",
                                    "device_id": "目标无人机设备 ID"
                                }
                            },
                            {
                                "func_name": "list_connections",
                                "func_desc": "转发查询 TCP 连接列表指令到指定类脑盒子",
                                "params": {
                                    "box_id": "目标类脑盒子标识符"
                                }
                            },
                            {
                                "func_name": "scan_drones",
                                "func_desc": "转发扫描指令到指定类脑盒子，触发无人机扫描",
                                "params": {
                                    "box_id": "目标类脑盒子标识符"
                                }
                            },
                            {
                                "func_name": "query_drones",
                                "func_desc": "转发查询指令到指定类脑盒子，获取无人机详情",
                                "params": {
                                    "box_id": "目标类脑盒子标识符",
                                    "device_id": "可选，指定查询的设备 ID",
                                    "status": "可选，按状态过滤"
                                }
                            },
                            {
                                "func_name": "send_command",
                                "func_desc": "转发控制指令到指定类脑盒子，操控目标无人机",
                                "params": {
                                    "box_id": "目标类脑盒子标识符",
                                    "device_id": "目标无人机设备 ID",
                                    "command": "指令内容字典，如 {'type': 'takeoff', 'altitude': 50.0} 或 {'type': 'goto', 'latitude': 39.9, 'longitude': 116.4, 'altitude': 100.0} 或 {'type': 'set_mode', 'mode': 'GUIDED'}"
                                }
                            },
                            {
                                "func_name": "navigation_instruction",
                                "func_desc": "下发导航指令，经由类脑盒子生成轨迹并发送到无人机",
                                "params": {
                                    "box_id": "目标类脑盒子标识符",
                                    "instruction_id": "导航指令唯一 ID",
                                    "device_id": "目标无人机设备 ID",
                                    "target_position": "目标位置字典 {'latitude': ..., 'longitude': ..., 'altitude': ...}",
                                    "algorithm": "导航算法名称，默认 'simple_linear'",
                                    "parameters": "可选的算法参数字典，如 {'step_count': 5, 'speed': 8.0}"
                                }
                            },
                            {
                                "func_name": "execute_trajectory",
                                "func_desc": "转发轨迹执行指令到类脑盒子",
                                "params": {
                                    "box_id": "目标类脑盒子标识符",
                                    "trajectory_id": "轨迹 ID（从导航指令响应中获取）"
                                }
                            },
                            {
                                "func_name": "list_devices",
                                "func_desc": "获取所有已知无人机设备列表（由类脑盒子上报，按 box_id 过滤）",
                                "params": {
                                    "box_id": "类脑盒子标识符，传 'all' 查询所有"
                                }
                            },
                            {
                                "func_name": "get_device_info",
                                "func_desc": "获取指定无人机设备的详细信息",
                                "params": {
                                    "box_id": "类脑盒子唯一标识符",
                                    "device_id": "无人机设备唯一标识符"
                                }
                            },
                            {
                                "func_name": "list_tasks",
                                "func_desc": "查询导航任务列表",
                                "params": {
                                    "box_id": "类脑盒子标识符，传 'all' 查询所有"
                                }
                            }
                        ]
                    }
                }
            ]
        }
    },
    "brainBox": {
        "0.0.0": {
            "tool_uniq_id": "2054136993080795138",
            "tool_desc": "类脑盒子（BrainBox）：边缘计算节点，通过WebSocket长连接与边缘服务器通信，负责无人机接入、协议转换、局部导航算法执行及状态上报。",
            "tool_cfg": [
                {
                    "FunDesc": "类脑盒子系统管理：配置管理及系统状态查询。无人机管理和导航指令由边缘服务器通过WebSocket下发。",
                    "ReqParam": {
                        "dtype": "brainBox",
                        "version": "0.0.0",
                        "subfuncs": [
                            {
                                "func_name": "get_config",
                                "func_desc": "获取类脑盒子当前配置信息（含边缘服务器地址、WebSocket连接、MAVLink连接、日志及存储配置）",
                                "params": {}
                            },
                            {
                                "func_name": "update_config",
                                "func_desc": "更新类脑盒子配置信息（支持部分更新）",
                                "params": {
                                    "box_id": "可选，类脑盒子唯一标识符",
                                    "edge": "可选，边缘服务器配置对象 {base_url, ws_url, heartbeat_interval, ...}",
                                    "mavlink": "可选，MAVLink通信配置对象 {connection_string, scan_interval, ...}",
                                    "logging": "可选，日志配置对象 {level, log_dir, ...}",
                                    "storage": "可选，存储配置对象 {db_path, device_evict_timeout}"
                                }
                            },
                            {
                                "func_name": "status",
                                "func_desc": "获取类脑盒子系统运行状态、WS连接状态、无人机汇总及可用算法/协议",
                                "params": {}
                            },
                            {
                                "func_name": "protocols",
                                "func_desc": "获取已注册的通信协议列表",
                                "params": {}
                            }
                        ]
                    }
                }
            ]
        }
    },
    "videoProcess": {
        "0.0.0": {
            "tool_uniq_id": "2054137347977633793",
            "tool_desc": "视频处理服务：支持视频流拉取、AI 算法分析（YOLO 等）及结果推送。models_cfg 为空时进入无模型直通模式，仅完成推拉流转发。",
            # loading_tools 配置（供 Process.py 动态加载本工具）：
            # {
            #   "dtype": "videoProcess",
            #   "version": "0.0.0",
            #   "dir_name": "videoProcess",
            #   "file_name": "videoProcess",
            #   "class_name": "CvideoProcess"
            # }
            "tool_cfg": [
                {
                    "FunDesc": "视频处理任务管理，支持启动、停止、查询任务及获取结果。",
                    "ReqParam": {
                        "dtype": "videoProcess",
                        "version": "0.0.0",
                        "subfuncs": [
                            {
                                "func_name": "start_task",
                                "func_desc": "启动视频处理任务。models_cfg 为空时进入无模型直通模式（纯推拉流）",
                                "params": {
                                    "pull_source": "拉流源类型：'local'（本地/RTMP/RTSP）或 'uva'（无人机 API）",
                                    "pull_url": "拉流地址（local 模式为流 URL；uva 模式为 API 查询地址）",
                                    "pull_type": "流协议类型，如 'rtmp'、'rtsp'、'webrtc'",
                                    "models_cfg": "模型配置列表（可选）。为空则进入无模型直通模式。示例：[{'model_folder': '/path/weights', 'model_name': 'yolov8n.pt', 'type': 'yolo'}]。支持多模型串联，按列表顺序依次处理每帧。",
                                    "output_type": "输出类型：'stream'（推流）、'json'（结果查询）、'mysql'（入库）",
                                    "buffer_size": "缓冲带大小（帧数，默认 30）。较小值降低延迟，较大值提升流畅度",
                                    "stream_push_mode": "推流模式，目前支持 'ffmpeg'",
                                    "stream_push_type": "推流协议类型，如 'rtmp'",
                                    "stream_push_srs_addr": "SRS 服务器地址，如 'localhost'",
                                    "stream_push_srs_port": "SRS 服务器端口，如 1935",
                                    "stream_push_stream_key": "推流 stream key，如 'detected'",
                                    "stream_push_url": "完整推流地址（填写后忽略上面三个 srs 参数），如 'rtmp://localhost:1935/live/detected'"
                                }
                            },
                            {
                                "func_name": "get_result",
                                "func_desc": "获取任务状态及结果",
                                "params": {
                                    "task_id": "任务唯一标识符"
                                }
                            },
                            {
                                "func_name": "list_tasks",
                                "func_desc": "列出所有任务（含运行中和已完成）",
                                "params": {}
                            },
                            {
                                "func_name": "stop_task",
                                "func_desc": "停止并删除指定任务",
                                "params": {
                                    "task_id": "任务唯一标识符"
                                }
                            },
                            {
                                "func_name": "get_stream_url",
                                "func_desc": "获取任务的输出流地址",
                                "params": {
                                    "task_id": "任务唯一标识符"
                                }
                            }
                        ]
                    }
                }
            ]
        }
    }
}
